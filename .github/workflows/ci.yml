name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

    # pytest exits non-zero on collection errors and when no tests are collected.
    - name: Run tests
      run: python -m pytest -v

    - name: Audit dependencies
      run: python -m pip_audit --strict --require-hashes -r requirements.txt

  # The deploy job (Workload Identity Federation, needs: test, main pushes only) arrives with the
  # Cloud Run services in Phase 2.
